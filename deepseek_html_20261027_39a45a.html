<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Shoe Analyzer · Oxford AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem 0.75rem 2rem;
      color: #1a2639;
    }

    .app-container {
      max-width: 680px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 12px 32px rgba(0, 20, 40, 0.08);
      padding: 1.5rem 1.25rem 1.75rem;
      transition: all 0.2s;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: #0f1e2e;
      margin-bottom: 0.2rem;
    }

    .subhead {
      font-size: 0.95rem;
      color: #4b5e72;
      margin-bottom: 1.6rem;
      border-left: 4px solid #cbd5e1;
      padding-left: 0.75rem;
      font-weight: 400;
      line-height: 1.4;
    }

    .upload-area {
      background: #f9fcff;
      border: 2px dashed #bdd3e8;
      border-radius: 24px;
      padding: 1.2rem 1rem;
      text-align: center;
      margin-bottom: 1.2rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .upload-area.dragover {
      background: #e6f0fa;
      border-color: #2d6a9f;
    }

    .file-input-label {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #1f3a57;
      color: white;
      padding: 0.85rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      border: none;
      box-shadow: 0 4px 12px rgba(20, 40, 70, 0.15);
    }

    .file-input-label:active {
      background: #0b1e2f;
      transform: scale(0.97);
    }

    #fileInput {
      display: none;
    }

    .preview-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .preview-thumb {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 20px;
      border: 3px solid white;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      background: #eef3f8;
    }

    .preview-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 20px;
      background: #eef3f8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #9eb2c7;
      border: 2px solid #d9e4ef;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 1.2rem 0 0.8rem;
      justify-content: center;
    }

    .btn-primary, .btn-secondary {
      flex: 1 1 auto;
      min-width: 130px;
      padding: 0.85rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .btn-primary {
      background: #1f3a57;
      color: white;
    }

    .btn-primary:active {
      background: #0d1f30;
      transform: scale(0.97);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      transform: none;
      pointer-events: none;
    }

    .btn-secondary {
      background: #f0f4fa;
      color: #1f3a57;
    }

    .btn-secondary:active {
      background: #d9e2ed;
      transform: scale(0.97);
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      transform: none;
      pointer-events: none;
    }

    .status-message {
      min-height: 1.8rem;
      font-size: 0.9rem;
      text-align: center;
      margin: 0.5rem 0 1rem;
      color: #2e4b6b;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .spinner {
      width: 1.25rem;
      height: 1.25rem;
      border: 3px solid #d0ddee;
      border-top-color: #1f3a57;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.4rem 1.2rem;
      margin-top: 1.2rem;
      border: 1px solid #e2ebf5;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
      transition: all 0.2s;
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1.1rem;
      color: #1f3a57;
      margin-bottom: 1rem;
      border-bottom: 1px solid #e9f0f7;
      padding-bottom: 0.6rem;
    }

    .ai-response {
      font-size: 1rem;
      line-height: 1.55;
      color: #152b3e;
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafdff;
      padding: 1rem 1rem;
      border-radius: 18px;
      border-left: 5px solid #1f3a57;
      font-family: 'SF Mono', 'Menlo', 'Cascadia Code', monospace;
      font-size: 0.93rem;
      max-height: 420px;
      overflow-y: auto;
    }

    .ai-response strong, .ai-response b {
      color: #0b2a44;
    }

    .error-text {
      color: #b22234;
      background: #fff1f2;
      padding: 0.9rem 1rem;
      border-radius: 16px;
      font-weight: 500;
      border-left: 5px solid #b22234;
    }

    .footer-note {
      font-size: 0.75rem;
      text-align: center;
      color: #7a8fa3;
      margin-top: 1.8rem;
      border-top: 1px solid #e2ebf5;
      padding-top: 1.2rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    /* responsive */
    @media (max-width: 480px) {
      .app-container {
        padding: 1.2rem 0.9rem 1.5rem;
        border-radius: 24px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .btn-primary, .btn-secondary {
        font-size: 0.95rem;
        padding: 0.75rem 0.8rem;
        min-width: 110px;
      }

      .preview-thumb, .preview-placeholder {
        width: 90px;
        height: 90px;
      }

      .ai-response {
        font-size: 0.88rem;
        padding: 0.85rem;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f1a24;
      }
      .app-container {
        background: #1a2a39;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      h1, .result-title {
        color: #d7e6f5;
      }
      .subhead {
        color: #a3bbd0;
        border-left-color: #3e5d78;
      }
      .upload-area {
        background: #152838;
        border-color: #2b4a65;
      }
      .file-input-label {
        background: #2d5c86;
      }
      .btn-primary {
        background: #2d5c86;
        color: #f0f7ff;
      }
      .btn-secondary {
        background: #213f56;
        color: #cbdae9;
      }
      .result-card {
        background: #1a2a39;
        border-color: #24445c;
      }
      .ai-response {
        background: #0f1f2c;
        color: #d0e2f2;
        border-left-color: #4d7da8;
      }
      .preview-placeholder {
        background: #1f3548;
        color: #7f9ab3;
      }
      .footer-note {
        color: #7f9ab3;
        border-top-color: #24445c;
      }
      .status-message {
        color: #b7cee3;
      }
      .error-text {
        background: #3b1e24;
        color: #ffb3b9;
      }
      .result-title {
        border-bottom-color: #24445c;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>👟 Shoe Analyzer</h1>
    <div class="subhead">Upload a shoe photo — get brand, size, price in PHP & more.</div>

    <!-- upload area -->
    <div class="upload-area" id="dropZone">
      <label for="fileInput" class="file-input-label">
        <span>📸</span> Choose photo
      </label>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" />
      <div class="preview-row">
        <div id="previewContainer" class="preview-placeholder">🖼️</div>
      </div>
    </div>

    <!-- action buttons -->
    <div class="button-group">
      <button class="btn-primary" id="analyzeBtn" disabled>
        <span>🔍</span> Analyze shoe
      </button>
      <button class="btn-secondary" id="cancelBtn" disabled>
        ✖ Cancel
      </button>
    </div>

    <!-- status / loading / error -->
    <div class="status-message" id="statusMsg"></div>

    <!-- result card -->
    <div class="result-card" id="resultCard" style="display: none;">
      <div class="result-title">
        <span>📋</span> Analysis result
      </div>
      <div id="responseText" class="ai-response"></div>
    </div>

    <div class="footer-note">
      Oxford AI · available in the Philippines · max 1 image, 5MB
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM elements ----------
      const fileInput = document.getElementById('fileInput');
      const previewContainer = document.getElementById('previewContainer');
      const analyzeBtn = document.getElementById('analyzeBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const statusMsg = document.getElementById('statusMsg');
      const resultCard = document.getElementById('resultCard');
      const responseText = document.getElementById('responseText');
      const dropZone = document.getElementById('dropZone');

      // ---------- state ----------
      let currentFile = null;           // the original file (or blob)
      let currentPreviewUrl = null;
      let abortController = null;
      let isRequesting = false;

      // ---------- helpers ----------
      const MAX_IMAGE_SIZE = 5 * 1024 * 1024; // 5 MB
      const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

      function setStatus(text, isError = false) {
        statusMsg.innerHTML = '';
        if (text) {
          if (isError) {
            statusMsg.innerHTML = `<span class="error-text" style="background:transparent;padding:0;">⚠️ ${escapeHtml(text)}</span>`;
          } else {
            statusMsg.textContent = text;
          }
        }
        // if request is running and no explicit error, we might show spinner via updateUI
      }

      function setLoadingUI(loading, message = '') {
        isRequesting = loading;
        if (loading) {
          statusMsg.innerHTML = `<span class="spinner"></span> ${escapeHtml(message || 'Analyzing shoe…')}`;
          analyzeBtn.disabled = true;
          cancelBtn.disabled = false;
        } else {
          // if not loading, clear status unless it's an error message already set
          if (statusMsg.querySelector('.spinner')) {
            statusMsg.innerHTML = '';
          }
          analyzeBtn.disabled = !currentFile;
          cancelBtn.disabled = true;
        }
        // keep analyze disabled if no file
        if (!loading) {
          analyzeBtn.disabled = !currentFile;
          cancelBtn.disabled = true;
        }
      }

      function escapeHtml(unsafe) {
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // clean previous result
      function clearResult() {
        resultCard.style.display = 'none';
        responseText.textContent = '';
      }

      // show error on result card
      function showError(message) {
        resultCard.style.display = 'block';
        responseText.innerHTML = `<div class="error-text">${escapeHtml(message)}</div>`;
      }

      // ---------- image handling ----------
      function revokePreview() {
        if (currentPreviewUrl) {
          URL.revokeObjectURL(currentPreviewUrl);
          currentPreviewUrl = null;
        }
      }

      function handleFile(file) {
        if (!file) return;

        // validate type
        if (!ALLOWED_TYPES.includes(file.type)) {
          setStatus('❌ Only JPEG, PNG, GIF, or WebP images are allowed.', true);
          return;
        }
        // validate size
        if (file.size > MAX_IMAGE_SIZE) {
          setStatus('❌ Image too large (max 5 MB).', true);
          return;
        }

        // clean previous preview
        revokePreview();
        if (currentFile) {
          // nothing else needed
        }

        currentFile = file;
        currentPreviewUrl = URL.createObjectURL(file);

        // update preview
        previewContainer.innerHTML = '';
        const img = document.createElement('img');
        img.className = 'preview-thumb';
        img.src = currentPreviewUrl;
        img.alt = 'Shoe preview';
        previewContainer.appendChild(img);

        // enable analyze button (if not currently requesting)
        if (!isRequesting) {
          analyzeBtn.disabled = false;
        }
        // clear any previous error/status
        setStatus('');
        clearResult();
      }

      function resetFileInput() {
        fileInput.value = '';
        revokePreview();
        currentFile = null;
        previewContainer.innerHTML = '🖼️';
        previewContainer.className = 'preview-placeholder';
        analyzeBtn.disabled = true;
        setStatus('');
        clearResult();
        if (isRequesting) {
          // if a request is running, cancel it
          cancelRequest();
        }
      }

      // ---------- cancel request ----------
      function cancelRequest() {
        if (abortController) {
          abortController.abort();
          abortController = null;
        }
        setLoadingUI(false);
        setStatus('Request cancelled.', false);
        if (!currentFile) analyzeBtn.disabled = true;
        else analyzeBtn.disabled = false;
        cancelBtn.disabled = true;
      }

      // ---------- resize & convert to jpeg (canvas) ----------
      async function resizeImage(file, maxSide = 1280, quality = 0.85) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            if (width > maxSide || height > maxSide) {
              if (width > height) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              } else {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error('Canvas conversion failed'));
              } else {
                resolve(blob);
              }
            }, 'image/jpeg', quality);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Could not load image'));
          };
          img.src = url;
        });
      }

      // ---------- build prompt ----------
      function buildPrompt() {
        return `You are a shoe expert. Analyze the uploaded shoe photo and provide a detailed description in the following format:

1. Description: Describe the shoe's style, color, material, condition, and notable features.
2. Brand: Identify the brand if visible/recognizable. If unknown, say "Unknown or unrecognizable".
3. Possible size: Estimate the shoe size (US/UK/EU) based on visual cues. If impossible, say "Cannot determine from photo".
4. Other details: Any other relevant info (e.g., model, release year, rarity).
5. Estimated price (PHP): Give a realistic price range in Philippine Pesos (₱) based on the brand, style, and condition. Use ₱ symbol.

Be concise but informative. Reply with ONLY a valid JSON object, no markdown, no code fences. Use exactly this structure:
{
  "description": "string",
  "brand": "string",
  "possible_size": "string",
  "other_details": "string",
  "estimated_price_php": "string"
}`;
      }

      // ---------- extract JSON safely ----------
      function extractJson(text) {
        const t = String(text).replace(/^```(?:json)?\s*|\s*```$/gi, '').trim();
        const s = t.indexOf('{'), e = t.lastIndexOf('}');
        if (s < 0 || e <= s) return null;
        try {
          return JSON.parse(t.slice(s, e + 1));
        } catch {
          return null;
        }
      }

      // ---------- render result (structured or fallback) ----------
      function renderResult(apiReply) {
        let parsed = extractJson(apiReply);
        if (parsed && typeof parsed === 'object') {
          // validate fields
          const fields = ['description', 'brand', 'possible_size', 'other_details', 'estimated_price_php'];
          const hasAll = fields.every(f => typeof parsed[f] === 'string' || (f === 'other_details' && parsed[f] === undefined));
          if (hasAll || (parsed.description && parsed.brand)) {
            // build pretty display
            const desc = parsed.description || '—';
            const brand = parsed.brand || 'Unknown';
            const size = parsed.possible_size || 'Cannot determine';
            const details = parsed.other_details || '—';
            const price = parsed.estimated_price_php || '—';

            // Use textContent to avoid XSS, but we can create safe elements
            const container = document.createElement('div');
            container.style.whiteSpace = 'pre-wrap';
            container.style.fontFamily = 'inherit';

            const sections = [
              { label: '📝 Description', value: desc },
              { label: '🏷️ Brand', value: brand },
              { label: '📏 Possible size', value: size },
              { label: '🔍 Other details', value: details },
              { label: '💰 Estimated price (PHP)', value: price }
            ];

            sections.forEach(({ label, value }) => {
              const p = document.createElement('div');
              p.style.marginBottom = '0.6rem';
              const strong = document.createElement('strong');
              strong.textContent = label + ': ';
              const span = document.createElement('span');
              span.textContent = value;
              p.appendChild(strong);
              p.appendChild(span);
              container.appendChild(p);
            });

            responseText.innerHTML = '';
            responseText.appendChild(container);
          } else {
            // fallback to plain text
            responseText.textContent = apiReply;
          }
        } else {
          // fallback plain text
          responseText.textContent = apiReply;
        }
        resultCard.style.display = 'block';
      }

      // ---------- main analyze function ----------
      async function analyzeShoe() {
        if (!currentFile) {
          setStatus('Please select an image first.', true);
          return;
        }

        if (isRequesting) return;

        // Reset any previous result/error
        clearResult();
        setStatus('');

        // Prepare upload: resize & convert to jpeg blob
        let uploadBlob;
        try {
          setLoadingUI(true, 'Preparing image…');
          uploadBlob = await resizeImage(currentFile, 1280, 0.85);
        } catch (err) {
          setLoadingUI(false);
          setStatus('❌ Could not process image. Try another photo.', true);
          return;
        }

        // Build FormData
        const form = new FormData();
        form.append('message', buildPrompt());
        form.append('image', uploadBlob, 'shoe.jpg');

        // AbortController with timeout
        abortController = new AbortController();
        const timeoutId = setTimeout(() => {
          if (abortController) abortController.abort();
        }, 75000); // 75s

        setLoadingUI(true, 'Analyzing shoe… this may take up to 30s');

        try {
          const res = await fetch('https://oxford.uk.eu.org/ai/oxford', {
            method: 'POST',
            body: form,
            signal: abortController.signal
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            // show data.error if present
            const errorMsg = data.error || `Request failed (HTTP ${res.status})`;
            if (res.status === 403) {
              throw new Error('Available only in the Philippines.');
            } else if (res.status === 413) {
              throw new Error('Image too large. Please use a smaller image.');
            } else if (res.status === 429) {
              const retry = res.headers.get('Retry-After') || 'a minute';
              throw new Error(`Too many requests. Wait ${retry}.`);
            } else if (res.status === 502 || res.status === 503) {
              throw new Error('AI temporarily unavailable. Try again shortly.');
            } else {
              throw new Error(errorMsg);
            }
          }

          if (!data.reply) {
            throw new Error('No reply from AI.');
          }

          renderResult(data.reply);
          setStatus('Analysis complete ✅');
        } catch (err) {
          if (err.name === 'AbortError') {
            setStatus('Request timed out or cancelled.', true);
          } else {
            setStatus(err.message || 'Network error. Please try again.', true);
          }
          // also show error in result card area for clarity
          showError(err.message || 'Network error.');
        } finally {
          clearTimeout(timeoutId);
          abortController = null;
          setLoadingUI(false);
          if (currentFile) analyzeBtn.disabled = false;
          cancelBtn.disabled = true;
        }
      }

      // ---------- event listeners ----------
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (file) {
          handleFile(file);
        } else {
          // if user cancels file selection
          if (!currentFile) resetFileInput();
        }
      });

      analyzeBtn.addEventListener('click', analyzeShoe);

      cancelBtn.addEventListener('click', () => {
        if (isRequesting) {
          cancelRequest();
        }
      });

      // drag & drop support
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
      });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files?.[0];
        if (file) {
          // manually set file input? Not needed; just handle file
          handleFile(file);
        }
      });

      // prevent default on whole page to avoid opening image on drop outside
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => e.preventDefault());

      // initial state
      analyzeBtn.disabled = true;
      cancelBtn.disabled = true;

      // clean up on page unload
      window.addEventListener('beforeunload', revokePreview);
    })();
  </script>
</body>
</html>
